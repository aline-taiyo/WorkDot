<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkDot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 268px;
      background-color: #09090b;
      color: #fafafa;
      font-family: "Pretendard", "Segoe UI", "Malgun Gothic", sans-serif;
      border: 1px solid #27272a;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background-color: #09090b;
      border-bottom: 1px solid #27272a;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand img {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .brand-info {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .app-name {
      font-size: 13.5px;
      font-weight: 700;
      color: #fafafa;
      letter-spacing: -0.01em;
    }

    .version-badge {
      font-size: 11px;
      font-weight: 600;
      color: #a1a1aa;
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 5px;
      padding: 1px 6px;
      font-family: "Cascadia Mono", "Consolas", monospace;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background-color: #71717a;
      flex-shrink: 0;
    }

    .status-dot.connected {
      background-color: #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.65);
    }

    .status-dot.disconnected {
      background-color: #f59e0b;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.55);
    }

    .menu {
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .menu-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background-color: transparent;
      color: #fafafa;
      cursor: pointer;
      text-align: left;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .menu-btn:hover {
      background-color: #18181b;
      border-color: #27272a;
    }

    .menu-btn:active {
      background-color: #27272a;
    }

    .menu-btn.active {
      background-color: #18181b;
      border-color: #27272a;
    }

    .menu-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background-color: #121215;
      border: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #a1a1aa;
    }

    .menu-btn:hover .menu-icon,
    .menu-btn.active .menu-icon {
      color: #fafafa;
      border-color: #3f3f46;
    }

    .menu-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    .menu-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #fafafa;
      line-height: 1.2;
    }

    .menu-sub {
      font-size: 11px;
      color: #71717a;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .menu-sub.highlight {
      color: #10b981;
    }

    .chevron {
      color: #71717a;
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }

    .menu-btn.active .chevron {
      transform: rotate(180deg);
      color: #a1a1aa;
    }

    .auto-login-panel {
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      margin: 2px 0 4px 0;
      background-color: #121215;
      border: 1px solid #27272a;
      border-radius: 8px;
    }

    .auto-login-panel.open {
      display: flex;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: #d4d4d8;
      cursor: pointer;
    }

    .toggle-row input[type="checkbox"] {
      accent-color: #10b981;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-label {
      font-size: 10.5px;
      color: #a1a1aa;
      font-weight: 500;
    }

    .field-input {
      width: 100%;
      padding: 7px 9px;
      font-size: 12px;
      color: #fafafa;
      background-color: #09090b;
      border: 1px solid #27272a;
      border-radius: 6px;
      outline: none;
      font-family: inherit;
      user-select: text;
    }

    .field-input:focus {
      border-color: #10b981;
    }

    .field-input::placeholder {
      color: #52525b;
    }

    .panel-actions {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }

    .btn-save {
      flex: 1;
      padding: 7px 10px;
      border: none;
      border-radius: 6px;
      background-color: #10b981;
      color: #052e16;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }

    .btn-save:hover {
      background-color: #34d399;
    }

    .btn-clear {
      padding: 7px 10px;
      border: 1px solid #27272a;
      border-radius: 6px;
      background-color: #18181b;
      color: #a1a1aa;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    .btn-clear:hover {
      background-color: #27272a;
      color: #f87171;
      border-color: #3f3f46;
    }

    .panel-msg {
      font-size: 11px;
      min-height: 14px;
      color: #10b981;
      line-height: 1.3;
    }

    .panel-msg.warn {
      color: #f59e0b;
    }

    .panel-hint {
      font-size: 10px;
      color: #71717a;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icon.png" alt="WorkDot" />
      <div class="brand-info">
        <span class="app-name" id="app-name">WorkDot</span>
        <span class="version-badge" id="app-version">v2.0.4</span>
      </div>
    </div>
    <span class="status-dot" id="bridge-dot" title="위젯 연결 상태 확인 중"></span>
  </div>

  <div class="menu">
    <button type="button" class="menu-btn" id="btn-open-daou">
      <div class="menu-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <div class="menu-text">
        <span class="menu-title">다우오피스</span>
        <span class="menu-sub">근태 페이지 열기</span>
      </div>
    </button>

    <button type="button" class="menu-btn" id="btn-toggle-autologin">
      <div class="menu-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="menu-text">
        <span class="menu-title">자동 로그인</span>
        <span class="menu-sub" id="autologin-sub">꺼짐</span>
      </div>
      <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>

    <div class="auto-login-panel" id="auto-login-panel">
      <label class="toggle-row">
        <span>자동 로그인 사용</span>
        <input type="checkbox" id="chk-auto-login-enabled" />
      </label>

      <label class="toggle-row">
        <span>로그인 버튼 자동 클릭</span>
        <input type="checkbox" id="chk-auto-login-submit" checked />
      </label>

      <div class="field-group">
        <label class="field-label" for="input-username">아이디</label>
        <input type="text" class="field-input" id="input-username" placeholder="다우오피스 아이디" autocomplete="username" />
      </div>

      <div class="field-group">
        <label class="field-label" for="input-password">비밀번호</label>
        <input type="password" class="field-input" id="input-password" placeholder="비밀번호" autocomplete="current-password" />
      </div>

      <div class="panel-actions">
        <button type="button" class="btn-save" id="btn-save-autologin">저장</button>
        <button type="button" class="btn-clear" id="btn-clear-autologin">삭제</button>
      </div>

      <div class="panel-msg" id="auto-login-msg"></div>
      <div class="panel-hint">현재 PC의 크롬 로컬 저장소에만 보관되며 외부로 전송되지 않습니다.</div>
    </div>

    <button type="button" class="menu-btn" id="btn-update-version">
      <div class="menu-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </div>
      <div class="menu-text">
        <span class="menu-title">버전 업데이트</span>
        <span class="menu-sub" id="update-sub">확장프로그램 리로드</span>
      </div>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
