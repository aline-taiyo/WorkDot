name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.5.10)'
        required: true
        default: 'v1.5.10'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix
          wix eula accept wix7

      - name: Publish WorkDot and Build MSI Installer
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $ver = $tag.TrimStart('v', 'V')
          if (-not $ver) { $ver = "1.5.7" }
          dotnet publish src/WorkDot/WorkDot.csproj -c Release -r win-x64 --self-contained false -o dist/publish
          wix build installer/WorkDot.wxs -arch x64 -d ProductVersion="$ver" -o "dist/WorkDot-Setup-win-x64.msi"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: dist/WorkDot-Setup-win-x64.msi
