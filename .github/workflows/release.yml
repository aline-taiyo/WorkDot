name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.5.14)'
        required: true
        default: 'v1.5.14'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix
          wix eula accept wix7

      - name: Publish WorkDot and Build MSI Installer
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $ver = $tag.TrimStart('v', 'V')
          if (-not $ver) { $ver = "1.5.7" }
          # 태그 버전을 바이너리에 강제 주입하여 태그와 앱 내부 버전이 어긋나지 않게 한다 (무한 자동 업데이트 방지)
          dotnet publish src/WorkDot/WorkDot.csproj -c Release -r win-x64 --self-contained false -o dist/publish -p:Version=$ver
          wix build installer/WorkDot.wxs -arch x64 -d ProductVersion="$ver" -o "dist/WorkDot-Setup-win-x64.msi"

      - name: Extract Release Notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $changelog = Get-Content CHANGELOG.md -Raw
          $escapedTag = [regex]::Escape($tag)
          $pattern = "(?ms)## \[$escapedTag\].*?(?=(?:^## \[v)|\z)"
          if ($changelog -match $pattern) {
              $notes = $matches[0].Trim()
              Set-Content -Path "dist/release-notes.md" -Value $notes -Encoding utf8NoBOM
              Write-Host "Extracted release notes for $tag"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          body_path: dist/release-notes.md
          generate_release_notes: true
          files: dist/WorkDot-Setup-win-x64.msi
